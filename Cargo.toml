[package]
name = "tatimoreira-blog"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "ssg"
path = "api/ssg.rs"

[dependencies]
pulldown-cmark = "0.9"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.11", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
